name: CI - Ecuador Travel Planner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# El CI solo necesita leer el repositorio.
permissions:
  contents: read

# Si llegan nuevos commits a la misma PR, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-y-build:
    name: ESLint, build y artefacto
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar la calidad del código con ESLint
        run: npm run lint

      - name: Compilar la aplicación React
        run: npm run build

      - name: Guardar la carpeta dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
