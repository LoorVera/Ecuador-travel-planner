name: CI - Ecuador Travel Planner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Permite relanzar el workflow desde la pestaña Actions sin hacer un commit.
  workflow_dispatch:

# El CI solo necesita leer el repositorio.
permissions:
  contents: read

# Si llegan nuevos commits a la misma PR, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-y-build:
    name: ESLint, pruebas, build y artefacto
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar la calidad del código con ESLint
        run: npm run lint

      - name: Ejecutar pruebas del asistente
        run: npm test

      # Las VITE_FIREBASE_* son públicas, pero no viven en el repositorio: sin
      # ellas el build compila y el artefacto no arranca en el navegador.
      # Se aceptan como Variables (recomendado) o como Secrets.
      - name: Comprobar variables públicas de build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT || secrets.VITE_AI_ENDPOINT }}
        run: |
          set -e
          for nombre in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!nombre}" ]; then
              echo "::error::Falta $nombre. Créala en Settings -> Secrets and variables -> Actions -> pestaña Variables (o como Secret)."
              exit 1
            fi
          done
          if [ -z "$VITE_AI_ENDPOINT" ]; then
            echo "::warning::VITE_AI_ENDPOINT está vacío: el artefacto usará /api/gemini y el sitio mostrará el modo demostración."
          fi

      - name: Compilar la aplicación React
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT || secrets.VITE_AI_ENDPOINT }}
          VITE_AI_FALLBACK: ${{ vars.VITE_AI_FALLBACK || secrets.VITE_AI_FALLBACK || 'mock' }}

      - name: Guardar la carpeta dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # 14 días para que el artefacto siga disponible durante la entrega.
          retention-days: 14
