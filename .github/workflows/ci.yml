name: CI - Ecuador Travel Planner

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Compilar aplicación React
        run: npm run build

      - name: Guardar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
